<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Conta - ConstruLoja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-panel">
            <div class="login-brand">
                <span class="brand-icon">S</span>
                <div>
                    <strong>ConstruLoja</strong>
                    <small>Cadastro administrativo</small>
                </div>
            </div>

            <form id="formCadastroConta" class="login-form">
                <div>
                    <h1>Criar conta</h1>
                    <p>Cadastre uma conta administrativa para acessar o sistema.</p>
                </div>

                <div id="mensagem" aria-live="polite"></div>

                <div class="form-field">
                    <label class="form-label" for="nome">Nome</label>
                    <input type="text" id="nome" class="form-control" autocomplete="name" placeholder="Nome do administrador">
                </div>

                <div class="form-field">
                    <label class="form-label" for="cpf">CPF</label>
                    <input type="text" id="cpf" class="form-control" inputmode="numeric" maxlength="14" autocomplete="username" placeholder="000.000.000-00">
                </div>

                <div class="form-field">
                    <label class="form-label" for="senha">Senha</label>
                    <input type="password" id="senha" class="form-control" autocomplete="new-password" placeholder="Digite uma senha">
                </div>

                <button type="submit" class="btn btn-primary w-100" id="btnCadastrar">
                    Cadastrar e entrar
                </button>

                <p class="login-switch">
                    Ja tem conta? <a href="login.HTML">Entrar</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/cadastro-conta.js"></script>
</body>
</html>
