<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SisEPI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-panel">
            <div class="login-brand">
                <span class="brand-icon">S</span>
                <div>
                    <strong>SisEPI</strong>
                    <small>Controle de EPIs SENAI</small>
                </div>
            </div>

            <form id="formLogin" class="login-form">
                <div>
                    <h1>Acesso administrativo</h1>
                    <p>Entre com o CPF e senha cadastrados para gerenciar colaboradores, equipamentos e emprestimos.</p>
                </div>

                <div id="mensagem" aria-live="polite"></div>

                <div class="form-field">
                    <label class="form-label" for="cpf">CPF</label>
                    <input type="text" id="cpf" class="form-control" inputmode="numeric" maxlength="14" autocomplete="username" placeholder="000.000.000-00" required>
                </div>

                <div class="form-field">
                    <label class="form-label" for="senha">Senha</label>
                    <input type="password" id="senha" class="form-control" autocomplete="current-password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="btnLogin">
                    Entrar
                </button>

                <p class="login-switch">
                    Nao tem conta? <a href="cadastro_conta.html">Cadastrar</a>
                </p>
            </form>
        </section>
    </main>

<script src="js/login.js"></script>

</body>
</html>
